<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ulil Aidi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: background 0.2s ease;
            background: #0b0c10; /* fallback */
        }

        /* Kartu utama dengan efek neon (bisa dinonaktifkan jika user pilih background tertentu) */
        .micro-card {
            max-width: 600px;
            width: 100%;
            background: rgba(18, 20, 28, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 2rem 1.75rem;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), 0 0 30px rgba(255, 0, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: box-shadow 0.3s ease, background 0.2s;
            position: relative;
        }

        /* animasi neon default (bisa dimatikan via class) */
        .micro-card.neon-active {
            animation: neonPulse 4s infinite alternate;
        }

        @keyframes neonPulse {
            0% {
                box-shadow: 0 0 8px rgba(0, 255, 255, 0.4), 0 0 20px rgba(0, 255, 255, 0.2);
                border-color: rgba(0, 255, 255, 0.4);
            }
            33% {
                box-shadow: 0 0 15px rgba(255, 0, 255, 0.6), 0 0 30px rgba(255, 0, 255, 0.3);
                border-color: rgba(255, 0, 255, 0.6);
            }
            66% {
                box-shadow: 0 0 12px rgba(255, 255, 0, 0.5), 0 0 25px rgba(255, 255, 0, 0.3);
                border-color: rgba(255, 255, 0, 0.5);
            }
            100% {
                box-shadow: 0 0 18px rgba(0, 255, 128, 0.6), 0 0 35px rgba(0, 255, 128, 0.3);
                border-color: rgba(0, 255, 128, 0.6);
            }
        }

        /* Ikon settings tersembunyi */
        .hidden-settings-icon {
            position: absolute;
            bottom: 15px;
            right: 20px;
            opacity: 0.18;
            transition: opacity 0.2s, transform 0.1s;
            cursor: pointer;
            font-size: 1.2rem;
            color: #ccd6ff;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .hidden-settings-icon:hover {
            opacity: 0.85;
            transform: scale(1.05);
            background: rgba(100, 110, 200, 0.7);
        }

        /* Profile */
        .profile {
            text-align: center;
            margin-bottom: 2rem;
        }

        .avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 1rem;
            background: #2c2e3a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.25);
        }

        .avatar-fallback {
            font-size: 3rem;
            font-weight: 500;
            color: white;
            background: #3b3f5c;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .profile h2 {
            font-size: 1.7rem;
            font-weight: 700;
            color: #f1f3f9;
            letter-spacing: -0.3px;
            margin-bottom: 0.3rem;
        }

        .profile .bio {
            color: #b0b6dd;
            font-size: 0.9rem;
            max-width: 280px;
            margin: 0 auto;
            line-height: 1.4;
        }

        /* Daftar link */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 0.5rem 0 2rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 1rem 1.5rem;
            text-decoration: none;
            color: #eef2ff;
            font-weight: 500;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            gap: 12px;
        }

        .link-btn:hover {
            background: rgba(93, 99, 162, 0.5);
            border-color: rgba(120, 130, 255, 0.7);
            transform: translateY(-2px);
            color: white;
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
        }

        .link-left i {
            font-size: 1.3rem;
            width: 28px;
            text-align: center;
            color: #b9c0ff;
        }

        .link-text {
            font-size: 1rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-container {
            background: #181c28;
            border-radius: 2rem;
            width: 90%;
            max-width: 620px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.8rem;
            border: 1px solid rgba(80, 180, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .modal-container h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #e0e5ff;
            margin-bottom: 1.2rem;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #2f3450;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 1.4rem;
        }

        .form-group label {
            display: block;
            color: #b9c0e5;
            font-weight: 500;
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: #252a3a;
            border: 1px solid #3f435a;
            padding: 0.7rem 1rem;
            border-radius: 1.2rem;
            color: white;
            font-size: 0.9rem;
        }

        .bg-preview {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .bg-sample {
            width: 60px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid #6c7aff;
            cursor: pointer;
            transition: 0.1s;
        }
        .opacity-slider {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .opacity-slider input {
            flex: 1;
        }

        .links-editor {
            background: #10131c;
            border-radius: 1.5rem;
            padding: 1rem;
            margin: 1rem 0;
        }

        .link-item-editor {
            background: #1e2230;
            border-radius: 1.2rem;
            padding: 0.8rem;
            margin-bottom: 1rem;
        }

        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .input-row input:first-child { flex: 2; }
        .input-row input:last-child { flex: 3; }

        .hide-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            font-size: 0.8rem;
            color: #b9c2ec;
        }
        .hide-toggle input { width: 18px; height: 18px; cursor: pointer; accent-color: #6c7aff; }
        .btn-remove-link {
            background: none;
            border: none;
            color: #ff8a8a;
            cursor: pointer;
            margin-top: 6px;
            text-align: right;
            font-size: 0.8rem;
        }
        .btn-add-link {
            background: rgba(108, 122, 255, 0.2);
            border: 1px dashed #8f9bff;
            color: #cfd9ff;
            padding: 0.7rem;
            border-radius: 2rem;
            width: 100%;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 2rem;
        }
        .btn-save { background: #6c7aff; border: none; padding: 0.8rem 1.5rem; border-radius: 2rem; font-weight: 600; color: white; cursor: pointer; }
        .btn-cancel { background: transparent; border: 1px solid #5a5f82; padding: 0.8rem 1.5rem; border-radius: 2rem; color: #cdd2ff; cursor: pointer; }
        .empty-links-message { color: #8e94b0; text-align: center; padding: 1rem; font-style: italic; }
        .footer-note { display: none; }
        hr { border-color: #2f3450; margin: 15px 0; }
    </style>
</head>
<body>
<div class="micro-card neon-active" id="mainCard">
    <div class="hidden-settings-icon" id="hiddenSettingsBtn">
        <i class="fas fa-cog"></i>
    </div>
    <div class="profile">
        <div class="avatar" id="avatarContainer"></div>
        <h2 id="profileName">...</h2>
        <div class="bio" id="profileBio"></div>
    </div>
    <div class="links-list" id="linksList"></div>
</div>

<!-- MODAL PENGATURAN (Lengkap: profile, links, background) -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-container">
        <h3><i class="fas fa-sliders-h"></i> Kelola Semua Pengaturan</h3>
        
        <!-- Tab Profil -->
        <div class="form-group"><label>Nama tampilan</label><input type="text" id="editName"></div>
        <div class="form-group"><label>Bio</label><textarea id="editBio" rows="2"></textarea></div>
        <div class="form-group"><label>URL Avatar</label><input type="text" id="editAvatarUrl" placeholder="https://..."></div>
        
        <hr>
        <h3 style="font-size:1.2rem;"><i class="fas fa-palette"></i> Background & Gaya</h3>
        <div class="form-group">
            <label>Tipe Background</label>
            <select id="bgType">
                <option value="default">✨ Default (Neon Gradient + Animasi)</option>
                <option value="solid">Warna Solid</option>
                <option value="gradient">Gradient Linear</option>
                <option value="image">Gambar URL</option>
            </select>
        </div>
        <div class="form-group" id="solidColorGroup" style="display:none;">
            <label>Warna Solid</label>
            <input type="color" id="solidColor" value="#0b0c10">
        </div>
        <div class="form-group" id="gradientGroup" style="display:none;">
            <label>Gradient (contoh: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb4d))</label>
            <input type="text" id="gradientValue" placeholder="linear-gradient(135deg, #0f2027, #203a43, #2c5364)">
        </div>
        <div class="form-group" id="imageGroup" style="display:none;">
            <label>URL Gambar Background</label>
            <input type="text" id="bgImageUrl" placeholder="https://example.com/bg.jpg">
        </div>
        <div class="form-group">
            <label>Transparansi / Opacity Background <span id="opacityValue">100</span>%</label>
            <div class="opacity-slider">
                <input type="range" id="bgOpacity" min="0" max="100" value="100" step="1">
                <span>⬤</span>
            </div>
            <small style="color:#aaa;">Atur tingkat transparansi background (0% = transparan penuh)</small>
        </div>
        <div class="bg-preview">
            <div class="bg-sample" id="previewBox" style="background:#0b0c10;"></div>
            <span style="font-size:12px;">Pratinjau warna/gambar</span>
        </div>
        
        <hr>
        <h3 style="font-size:1.2rem;"><i class="fas fa-link"></i> Daftar Tautan (centang Hide untuk menyembunyikan)</h3>
        <div class="links-editor" id="linksEditorContainer"></div>
        <button class="btn-add-link" id="addLinkBtn"><i class="fas fa-plus-circle"></i> Tambah tautan</button>
        
        <div class="modal-actions">
            <button class="btn-cancel" id="cancelModalBtn">Batal</button>
            <button class="btn-save" id="saveSettingsBtn">Simpan Semua</button>
        </div>
    </div>
</div>

<script>
    // ========== PASSWORD ADMIN ==========
    const ADMIN_PASSWORD = "S@l@m1234";
    function verifyPassword() {
        if (sessionStorage.getItem("microweb_admin_verified") === "true") return true;
        const pwd = prompt("🔒 Akses pengaturan:");
        if (pwd === ADMIN_PASSWORD) {
            sessionStorage.setItem("microweb_admin_verified", "true");
            return true;
        } else {
            if (pwd !== null) alert("Kode akses salah!");
            return false;
        }
    }

    // ========== DATA STRUKTUR (termasuk background) ==========
    const DEFAULT_DATA = {
        profile: { name: "Aruna Vierra", bio: "Creative coder • Neon vibe", avatarUrl: "" },
        links: [
            { text: "Portofolio Kreatif", url: "https://linktr.ee/example", hidden: false },
            { text: "Instagram", url: "https://instagram.com/", hidden: false },
            { text: "TikTok (contoh hide)", url: "https://tiktok.com/@", hidden: true },
            { text: "Youtube Channel", url: "https://youtube.com/", hidden: false }
        ],
        background: {
            type: "default",     // default, solid, gradient, image
            solidColor: "#0b0c10",
            gradient: "linear-gradient(135deg, #0f2027, #203a43, #2c5364)",
            imageUrl: "",
            opacity: 100        // persen transparansi
        }
    };

    let appData = JSON.parse(JSON.stringify(DEFAULT_DATA));

    function loadFromStorage() {
        const stored = localStorage.getItem("microweb_neon_full");
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (parsed.profile && parsed.links && parsed.background) {
                    appData = parsed;
                    appData.links = appData.links.map(ln => ({ text: ln.text || "Tautan", url: ln.url || "#", hidden: ln.hidden === true }));
                    if (!appData.background) appData.background = DEFAULT_DATA.background;
                } else resetToDefault();
            } catch(e) { resetToDefault(); }
        } else resetToDefault();
        if (!appData.links.length) appData.links = [{ text: "Contoh tautan", url: "#", hidden: false }];
    }

    function resetToDefault() { appData = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
    function saveToStorage() { localStorage.setItem("microweb_neon_full", JSON.stringify(appData)); }

    // ========== Terapkan background ke body ==========
    function applyBackground() {
        const body = document.body;
        const bg = appData.background;
        const opacity = (bg.opacity / 100).toFixed(2);
        let bgStyle = "";
        if (bg.type === "default") {
            body.style.background = "#0b0c10"; // fallback, neon card tetap beranimasi
            document.getElementById("mainCard").classList.add("neon-active");
        } else {
            document.getElementById("mainCard").classList.remove("neon-active");
            if (bg.type === "solid") {
                const color = bg.solidColor || "#0b0c10";
                bgStyle = color;
            } else if (bg.type === "gradient") {
                bgStyle = bg.gradient || "linear-gradient(135deg, #1a2a6c, #b21f1f)";
            } else if (bg.type === "image") {
                const imgUrl = bg.imageUrl;
                if (imgUrl && imgUrl.trim()) bgStyle = `url('${imgUrl}') center/cover no-repeat`;
                else bgStyle = "#111";
            }
            if (bgStyle) {
                if (bg.type === "image") body.style.background = bgStyle;
                else body.style.background = bgStyle;
                body.style.backgroundSize = bg.type === "image" ? "cover" : "auto";
                // terapkan transparansi dengan background-blend (cara sederhana: ubah ke rgba jika solid)
                if (bg.type === "solid" && opacity < 1) {
                    // parse solidColor ke RGB
                    let tempDiv = document.createElement("div");
                    tempDiv.style.color = bg.solidColor;
                    document.body.appendChild(tempDiv);
                    let rgb = getComputedStyle(tempDiv).color;
                    document.body.removeChild(tempDiv);
                    if (rgb && rgb !== "rgba(0, 0, 0, 0)") {
                        body.style.background = `rgba(${rgb.match(/\d+/g).slice(0,3).join(",")}, ${opacity})`;
                    } else {
                        body.style.backgroundColor = bg.solidColor;
                        body.style.backgroundColor = `rgba(0,0,0,${opacity})`;
                    }
                } else if (bg.type === "gradient") {
                    // gradient transparansi bisa dicampur, cukup set opacity via background blend?
                    body.style.background = bgStyle;
                    if (opacity < 1) body.style.background = `linear-gradient(rgba(0,0,0,${1-opacity}), rgba(0,0,0,${1-opacity})), ${bgStyle}`;
                } else if (bg.type === "image") {
                    body.style.background = bgStyle;
                    if (opacity < 1) body.style.backgroundColor = `rgba(0,0,0,${1-opacity})`;
                    body.style.backgroundBlendMode = opacity < 1 ? "overlay" : "normal";
                }
            }
        }
    }

    function renderProfile() {
        document.getElementById("profileName").innerText = appData.profile.name || "Pengguna";
        document.getElementById("profileBio").innerText = appData.profile.bio || "";
        const avatarContainer = document.getElementById("avatarContainer");
        const initial = (appData.profile.name?.[0] || "U").toUpperCase();
        const avatarUrl = appData.profile.avatarUrl;
        if (avatarUrl && avatarUrl.trim()) {
            avatarContainer.innerHTML = `<img src="${avatarUrl}" alt="avatar" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\"avatar-fallback\">${initial}</div>';">`;
        } else {
            avatarContainer.innerHTML = `<div class="avatar-fallback">${initial}</div>`;
        }
    }

    function renderLinks() {
        const container = document.getElementById("linksList");
        const visible = appData.links.filter(l => !l.hidden);
        if (!visible.length) { container.innerHTML = `<div class="empty-links-message">✨ Tidak ada tautan tampil.</div>`; return; }
        container.innerHTML = "";
        visible.forEach(link => {
            const a = document.createElement("a"); a.className = "link-btn"; a.href = link.url !== "#" ? link.url : "#"; a.target = "_blank";
            const left = document.createElement("div"); left.className = "link-left";
            let icon = "fas fa-link";
            const t = link.text.toLowerCase();
            if (t.includes("instagram")) icon = "fab fa-instagram";
            else if (t.includes("tiktok")) icon = "fab fa-tiktok";
            else if (t.includes("youtube")) icon = "fab fa-youtube";
            else if (t.includes("github")) icon = "fab fa-github";
            left.innerHTML = `<i class="${icon}"></i><span class="link-text">${escapeHtml(link.text)}</span>`;
            a.appendChild(left); a.appendChild(document.createElement("i")).className = "fas fa-arrow-right";
            container.appendChild(a);
        });
    }

    function escapeHtml(s) { if(!s) return ""; return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    // ========== EDITOR LINKS + HIDE ==========
    let workingLinks = [];
    function openModal() {
        if (!verifyPassword()) return;
        document.getElementById("editName").value = appData.profile.name || "";
        document.getElementById("editBio").value = appData.profile.bio || "";
        document.getElementById("editAvatarUrl").value = appData.profile.avatarUrl || "";
        // background fields
        const bg = appData.background;
        document.getElementById("bgType").value = bg.type;
        document.getElementById("solidColor").value = bg.solidColor || "#0b0c10";
        document.getElementById("gradientValue").value = bg.gradient || "";
        document.getElementById("bgImageUrl").value = bg.imageUrl || "";
        document.getElementById("bgOpacity").value = bg.opacity;
        document.getElementById("opacityValue").innerText = bg.opacity;
        toggleBgFields(bg.type);
        workingLinks = appData.links.map(l => ({ ...l }));
        renderEditorLinks();
        document.getElementById("settingsModal").classList.add("active");
    }
    function toggleBgFields(type) {
        document.getElementById("solidColorGroup").style.display = type === "solid" ? "flex" : "none";
        document.getElementById("gradientGroup").style.display = type === "gradient" ? "flex" : "none";
        document.getElementById("imageGroup").style.display = type === "image" ? "flex" : "none";
    }
    function renderEditorLinks() {
        const container = document.getElementById("linksEditorContainer");
        if (!workingLinks.length) { container.innerHTML = `<div class="empty-links-message">Klik tambah tautan</div>`; return; }
        container.innerHTML = "";
        workingLinks.forEach((link, idx) => {
            const div = document.createElement("div"); div.className = "link-item-editor";
            div.innerHTML = `
                <div class="input-row"><input type="text" placeholder="Label" value="${escapeHtml(link.text)}" class="edit-text" data-idx="${idx}"><input type="text" placeholder="URL" value="${escapeHtml(link.url)}" class="edit-url" data-idx="${idx}"></div>
                <div class="hide-toggle"><input type="checkbox" id="hide_${idx}" ${link.hidden ? "checked" : ""} class="hide-chk" data-idx="${idx}"><label for="hide_${idx}">Sembunyikan tautan</label></div>
                <button class="btn-remove-link" data-rmidx="${idx}"><i class="fas fa-trash-alt"></i> Hapus</button>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('.edit-text').forEach(inp => inp.addEventListener('input', e => { let i=parseInt(e.target.dataset.idx); if(workingLinks[i]) workingLinks[i].text = e.target.value; }));
        document.querySelectorAll('.edit-url').forEach(inp => inp.addEventListener('input', e => { let i=parseInt(e.target.dataset.idx); if(workingLinks[i]) workingLinks[i].url = e.target.value; }));
        document.querySelectorAll('.hide-chk').forEach(chk => chk.addEventListener('change', e => { let i=parseInt(e.target.dataset.idx); if(workingLinks[i]) workingLinks[i].hidden = e.target.checked; }));
        document.querySelectorAll('.btn-remove-link').forEach(btn => btn.addEventListener('click', e => { let i=parseInt(btn.dataset.rmidx); if(!isNaN(i)){ workingLinks.splice(i,1); renderEditorLinks(); } }));
    }
    function addNewLink() { workingLinks.push({ text: "Tautan baru", url: "https://", hidden: false }); renderEditorLinks(); }
    function saveAll() {
        appData.profile.name = document.getElementById("editName").value.trim() || "Pengguna";
        appData.profile.bio = document.getElementById("editBio").value.trim();
        appData.profile.avatarUrl = document.getElementById("editAvatarUrl").value.trim();
        // background
        const bgType = document.getElementById("bgType").value;
        appData.background.type = bgType;
        appData.background.solidColor = document.getElementById("solidColor").value;
        appData.background.gradient = document.getElementById("gradientValue").value;
        appData.background.imageUrl = document.getElementById("bgImageUrl").value;
        appData.background.opacity = parseInt(document.getElementById("bgOpacity").value,10);
        appData.links = workingLinks.filter(l => l.text && l.text.trim()).map(l => ({ text: l.text.trim(), url: l.url.trim() || "#", hidden: l.hidden === true }));
        if (!appData.links.length) appData.links = [{ text: "Halaman awal", url: "#", hidden: false }];
        saveToStorage();
        renderProfile(); renderLinks(); applyBackground();
        closeModal();
    }
    function closeModal() { document.getElementById("settingsModal").classList.remove("active"); }

    document.addEventListener("DOMContentLoaded", () => {
        loadFromStorage();
        renderProfile(); renderLinks(); applyBackground();
        document.getElementById("hiddenSettingsBtn").addEventListener("click", openModal);
        document.getElementById("cancelModalBtn").addEventListener("click", closeModal);
        document.getElementById("saveSettingsBtn").addEventListener("click", saveAll);
        document.getElementById("addLinkBtn").addEventListener("click", addNewLink);
        document.getElementById("settingsModal").addEventListener("click", (e) => { if(e.target === document.getElementById("settingsModal")) closeModal(); });
        // preview & opacity
        const bgTypeSelect = document.getElementById("bgType");
        bgTypeSelect.addEventListener("change", (e) => toggleBgFields(e.target.value));
        const opacitySlider = document.getElementById("bgOpacity");
        opacitySlider.addEventListener("input", (e) => { document.getElementById("opacityValue").innerText = e.target.value; });
    });
</script>
</body>
</html>
