<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ulil Aidi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0c10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        /* Efek neon ambient berubah-ubah */
        .micro-card {
            max-width: 600px;
            width: 100%;
            background: rgba(18, 20, 28, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 2rem 1.75rem;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), 0 0 30px rgba(255, 0, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: box-shadow 0.3s ease;
            animation: neonPulse 4s infinite alternate;
        }

        @keyframes neonPulse {
            0% {
                box-shadow: 0 0 8px rgba(0, 255, 255, 0.4), 0 0 20px rgba(0, 255, 255, 0.2);
                border-color: rgba(0, 255, 255, 0.4);
            }
            33% {
                box-shadow: 0 0 15px rgba(255, 0, 255, 0.6), 0 0 30px rgba(255, 0, 255, 0.3);
                border-color: rgba(255, 0, 255, 0.6);
            }
            66% {
                box-shadow: 0 0 12px rgba(255, 255, 0, 0.5), 0 0 25px rgba(255, 255, 0, 0.3);
                border-color: rgba(255, 255, 0, 0.5);
            }
            100% {
                box-shadow: 0 0 18px rgba(0, 255, 128, 0.6), 0 0 35px rgba(0, 255, 128, 0.3);
                border-color: rgba(0, 255, 128, 0.6);
            }
        }

        /* Ikon settings tersembunyi (pojok kanan bawah) */
        .hidden-settings-icon {
            position: absolute;
            bottom: 15px;
            right: 20px;
            opacity: 0.18;
            transition: opacity 0.2s, transform 0.1s;
            cursor: pointer;
            font-size: 1.2rem;
            color: #ccd6ff;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .hidden-settings-icon:hover {
            opacity: 0.85;
            transform: scale(1.05);
            background: rgba(100, 110, 200, 0.7);
        }

        /* Profile */
        .profile {
            text-align: center;
            margin-bottom: 2rem;
        }

        .avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 1rem;
            background: #2c2e3a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.25);
        }

        .avatar-fallback {
            font-size: 3rem;
            font-weight: 500;
            color: white;
            background: #3b3f5c;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .profile h2 {
            font-size: 1.7rem;
            font-weight: 700;
            color: #f1f3f9;
            letter-spacing: -0.3px;
            margin-bottom: 0.3rem;
        }

        .profile .bio {
            color: #b0b6dd;
            font-size: 0.9rem;
            max-width: 280px;
            margin: 0 auto;
            line-height: 1.4;
        }

        /* Daftar link */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 0.5rem 0 2rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 1rem 1.5rem;
            text-decoration: none;
            color: #eef2ff;
            font-weight: 500;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            gap: 12px;
        }

        .link-btn:hover {
            background: rgba(93, 99, 162, 0.5);
            border-color: rgba(120, 130, 255, 0.7);
            transform: translateY(-2px);
            color: white;
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
        }

        .link-left i {
            font-size: 1.3rem;
            width: 28px;
            text-align: center;
            color: #b9c0ff;
        }

        .link-text {
            font-size: 1rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-container {
            background: #181c28;
            border-radius: 2rem;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.8rem;
            border: 1px solid rgba(80, 180, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .modal-container h3 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #e0e5ff;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 1.4rem;
        }

        .form-group label {
            display: block;
            color: #b9c0e5;
            font-weight: 500;
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: #252a3a;
            border: 1px solid #3f435a;
            padding: 0.8rem 1rem;
            border-radius: 1.2rem;
            color: white;
            font-size: 0.9rem;
        }

        .links-editor {
            background: #10131c;
            border-radius: 1.5rem;
            padding: 1rem;
            margin: 1rem 0;
        }

        .link-item-editor {
            background: #1e2230;
            border-radius: 1.2rem;
            padding: 0.8rem;
            margin-bottom: 1rem;
            transition: 0.1s;
        }

        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .input-row input:first-child {
            flex: 2;
        }

        .input-row input:last-child {
            flex: 3;
        }

        .hide-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            font-size: 0.8rem;
            color: #b9c2ec;
        }

        .hide-toggle input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #6c7aff;
        }

        .btn-remove-link {
            background: none;
            border: none;
            color: #ff8a8a;
            cursor: pointer;
            margin-top: 6px;
            text-align: right;
            font-size: 0.8rem;
        }

        .btn-add-link {
            background: rgba(108, 122, 255, 0.2);
            border: 1px dashed #8f9bff;
            color: #cfd9ff;
            padding: 0.7rem;
            border-radius: 2rem;
            width: 100%;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 2rem;
        }

        .btn-save {
            background: #6c7aff;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid #5a5f82;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            color: #cdd2ff;
            cursor: pointer;
        }

        .empty-links-message {
            color: #8e94b0;
            text-align: center;
            padding: 1rem;
            font-style: italic;
        }

        /* hidden footer */
        .footer-note {
            display: none;
        }
    </style>
</head>
<body>
<div class="micro-card">
    <div class="hidden-settings-icon" id="hiddenSettingsBtn">
        <i class="fas fa-cog"></i>
    </div>

    <div class="profile">
        <div class="avatar" id="avatarContainer"></div>
        <h2 id="profileName">...</h2>
        <div class="bio" id="profileBio"></div>
    </div>

    <div class="links-list" id="linksList"></div>
</div>

<!-- MODAL PENGATURAN (tanpa indikasi password di UI) -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-container">
        <h3><i class="fas fa-sliders-h"></i> Kelola Tautan & Profil</h3>
        <div class="form-group">
            <label>Nama tampilan</label>
            <input type="text" id="editName">
        </div>
        <div class="form-group">
            <label>Bio</label>
            <textarea id="editBio" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label>URL Avatar (opsional)</label>
            <input type="text" id="editAvatarUrl" placeholder="https://...">
        </div>
        <label style="color:#b9c0e5;"><i class="fas fa-link"></i> Daftar Tautan (centang Hide untuk menyembunyikan)</label>
        <div class="links-editor" id="linksEditorContainer"></div>
        <button class="btn-add-link" id="addLinkBtn"><i class="fas fa-plus-circle"></i> Tambah tautan baru</button>
        <div class="modal-actions">
            <button class="btn-cancel" id="cancelModalBtn">Batal</button>
            <button class="btn-save" id="saveSettingsBtn">Simpan Perubahan</button>
        </div>
    </div>
</div>

<script>
    // ===================== PASSWORD ADMIN (tersembunyi) =====================
    const ADMIN_PASSWORD = "S@l@m1234";   // Ganti sesuai keinginan

    function verifyPassword() {
        if (sessionStorage.getItem("microweb_admin_verified") === "true") return true;
        const pwd = prompt("🔒 Akses pengaturan:");
        if (pwd === ADMIN_PASSWORD) {
            sessionStorage.setItem("microweb_admin_verified", "true");
            return true;
        } else {
            if (pwd !== null) alert("Kode akses salah!");
            return false;
        }
    }

    // ------------------ Data default dengan properti hidden ------------------
    const DEFAULT_DATA = {
        profile: {
            name: "Aruna Vierra",
            bio: "Creative coder •  Neen light enthusiast",
            avatarUrl: ""
        },
        links: [
            { text: "Portofolio Kreatif", url: "https://linktr.ee/example", hidden: false },
            { text: "Instagram", url: "https://instagram.com/", hidden: false },
            { text: "TikTok (disembunyikan contoh)", url: "https://tiktok.com/@", hidden: true },
            { text: "Youtube Channel", url: "https://youtube.com/", hidden: false }
        ]
    };

    let appData = {
        profile: { ...DEFAULT_DATA.profile },
        links: JSON.parse(JSON.stringify(DEFAULT_DATA.links))
    };

    function loadFromStorage() {
        const stored = localStorage.getItem("microweb_neon_data");
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (parsed.profile && parsed.links && Array.isArray(parsed.links)) {
                    appData = parsed;
                    // pastikan setiap link punya properti hidden (default false jika tidak ada)
                    appData.links = appData.links.map(ln => ({
                        text: ln.text || "Tautan",
                        url: ln.url || "#",
                        hidden: ln.hidden === true ? true : false
                    }));
                } else {
                    resetToDefault();
                }
            } catch(e) { resetToDefault(); }
        } else {
            resetToDefault();
        }
        if (!appData.links.length) appData.links = [{ text: "Contoh tautan", url: "#", hidden: false }];
    }

    function resetToDefault() {
        appData = {
            profile: { ...DEFAULT_DATA.profile },
            links: JSON.parse(JSON.stringify(DEFAULT_DATA.links))
        };
    }

    function saveToStorage() {
        localStorage.setItem("microweb_neon_data", JSON.stringify(appData));
    }

    // render UI publik (hanya link dengan hidden == false)
    function renderProfile() {
        document.getElementById("profileName").innerText = appData.profile.name || "Pengguna";
        document.getElementById("profileBio").innerText = appData.profile.bio || "";
        const avatarContainer = document.getElementById("avatarContainer");
        const name = appData.profile.name || "U";
        const initial = name.charAt(0).toUpperCase();
        const avatarUrl = appData.profile.avatarUrl;
        if (avatarUrl && avatarUrl.trim()) {
            avatarContainer.innerHTML = `<img src="${avatarUrl}" alt="avatar" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\"avatar-fallback\">${initial}</div>';">`;
        } else {
            avatarContainer.innerHTML = `<div class="avatar-fallback">${initial}</div>`;
        }
    }

    function renderLinks() {
        const container = document.getElementById("linksList");
        const visibleLinks = appData.links.filter(link => !link.hidden);
        if (visibleLinks.length === 0) {
            container.innerHTML = `<div class="empty-links-message">✨ Tidak ada tautan yang ditampilkan saat ini.</div>`;
            return;
        }
        container.innerHTML = "";
        visibleLinks.forEach(link => {
            const a = document.createElement("a");
            a.className = "link-btn";
            a.href = link.url && link.url !== "#" ? link.url : "#";
            a.target = "_blank";
            const leftDiv = document.createElement("div");
            leftDiv.className = "link-left";
            let iconClass = "fas fa-link";
            const lower = link.text.toLowerCase();
            if (lower.includes("instagram")) iconClass = "fab fa-instagram";
            else if (lower.includes("tiktok")) iconClass = "fab fa-tiktok";
            else if (lower.includes("youtube")) iconClass = "fab fa-youtube";
            else if (lower.includes("github")) iconClass = "fab fa-github";
            else if (lower.includes("twitter")) iconClass = "fab fa-twitter";
            leftDiv.innerHTML = `<i class="${iconClass}"></i><span class="link-text">${escapeHtml(link.text)}</span>`;
            a.appendChild(leftDiv);
            a.appendChild(document.createElement("i")).className = "fas fa-arrow-right";
            container.appendChild(a);
        });
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ---------- MODAL EDITOR dengan opsi HIDE ----------
    let workingLinks = [];  // salinan sementara untuk edit

    function openModal() {
        if (!verifyPassword()) return;
        // isi form profile
        document.getElementById("editName").value = appData.profile.name || "";
        document.getElementById("editBio").value = appData.profile.bio || "";
        document.getElementById("editAvatarUrl").value = appData.profile.avatarUrl || "";
        workingLinks = appData.links.map(ln => ({ ...ln }));
        renderEditorLinks();
        document.getElementById("settingsModal").classList.add("active");
    }

    function renderEditorLinks() {
        const container = document.getElementById("linksEditorContainer");
        if (!workingLinks.length) {
            container.innerHTML = `<div class="empty-links-message">Belum ada tautan. Klik 'Tambah tautan baru'</div>`;
            return;
        }
        container.innerHTML = "";
        workingLinks.forEach((link, idx) => {
            const div = document.createElement("div");
            div.className = "link-item-editor";
            div.innerHTML = `
                <div class="input-row">
                    <input type="text" placeholder="Label tautan" value="${escapeHtml(link.text)}" class="edit-link-text" data-idx="${idx}">
                    <input type="text" placeholder="URL lengkap" value="${escapeHtml(link.url)}" class="edit-link-url" data-idx="${idx}">
                </div>
                <div class="hide-toggle">
                    <input type="checkbox" id="hideChk_${idx}" ${link.hidden ? 'checked' : ''} class="hide-checkbox" data-idx="${idx}">
                    <label for="hideChk_${idx}">Sembunyikan tautan ini (tidak tampil di publik)</label>
                </div>
                <button class="btn-remove-link" data-rmidx="${idx}"><i class="fas fa-trash-alt"></i> Hapus tautan</button>
            `;
            container.appendChild(div);
        });

        // event listener untuk input text & url
        document.querySelectorAll('.edit-link-text').forEach(inp => {
            inp.removeEventListener('input', handleTextChange);
            inp.addEventListener('input', handleTextChange);
        });
        document.querySelectorAll('.edit-link-url').forEach(inp => {
            inp.removeEventListener('input', handleUrlChange);
            inp.addEventListener('input', handleUrlChange);
        });
        document.querySelectorAll('.hide-checkbox').forEach(chk => {
            chk.removeEventListener('change', handleHideToggle);
            chk.addEventListener('change', handleHideToggle);
        });
        document.querySelectorAll('.btn-remove-link').forEach(btn => {
            btn.removeEventListener('click', handleRemoveLink);
            btn.addEventListener('click', handleRemoveLink);
        });
    }

    function handleTextChange(e) {
        const idx = parseInt(e.target.dataset.idx, 10);
        if (!isNaN(idx) && workingLinks[idx]) workingLinks[idx].text = e.target.value;
    }
    function handleUrlChange(e) {
        const idx = parseInt(e.target.dataset.idx, 10);
        if (!isNaN(idx) && workingLinks[idx]) workingLinks[idx].url = e.target.value;
    }
    function handleHideToggle(e) {
        const idx = parseInt(e.target.dataset.idx, 10);
        if (!isNaN(idx) && workingLinks[idx]) workingLinks[idx].hidden = e.target.checked;
    }
    function handleRemoveLink(e) {
        const btn = e.currentTarget;
        const idx = parseInt(btn.dataset.rmidx, 10);
        if (!isNaN(idx) && idx >= 0 && idx < workingLinks.length) {
            workingLinks.splice(idx, 1);
            renderEditorLinks();
        }
    }

    function addNewLink() {
        workingLinks.push({ text: "Tautan baru", url: "https://", hidden: false });
        renderEditorLinks();
    }

    function saveAllChanges() {
        // simpan profile
        appData.profile.name = document.getElementById("editName").value.trim() || "Pengguna";
        appData.profile.bio = document.getElementById("editBio").value.trim();
        appData.profile.avatarUrl = document.getElementById("editAvatarUrl").value.trim();
        // simpan links, pastikan setiap link memiliki properti hidden
        appData.links = workingLinks.filter(ln => ln.text && ln.text.trim() !== "").map(ln => ({
            text: ln.text.trim(),
            url: ln.url.trim() === "" ? "#" : ln.url.trim(),
            hidden: ln.hidden === true
        }));
        if (appData.links.length === 0) {
            appData.links = [{ text: "Landing page", url: "#", hidden: false }];
        }
        saveToStorage();
        renderProfile();
        renderLinks();
        closeModal();
    }

    function closeModal() {
        document.getElementById("settingsModal").classList.remove("active");
    }

    // Inisialisasi dan event
    document.addEventListener("DOMContentLoaded", () => {
        loadFromStorage();
        renderProfile();
        renderLinks();

        const hiddenBtn = document.getElementById("hiddenSettingsBtn");
        const cancelBtn = document.getElementById("cancelModalBtn");
        const saveBtn = document.getElementById("saveSettingsBtn");
        const addBtn = document.getElementById("addLinkBtn");

        hiddenBtn.addEventListener("click", openModal);
        cancelBtn.addEventListener("click", closeModal);
        saveBtn.addEventListener("click", saveAllChanges);
        addBtn.addEventListener("click", addNewLink);

        // klik overlay menutup
        const modal = document.getElementById("settingsModal");
        modal.addEventListener("click", (e) => {
            if (e.target === modal) closeModal();
        });
    });
</script>
</body>
</html>
