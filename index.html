<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ulil Aidi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Variabel hue yang bisa dianimasikan (0-360) untuk efek RGB */
        @property --hue {
            syntax: '<number>';
            inherits: true;
            initial-value: 0;
        }

        /* Sudut putaran garis RGB (searah jarum jam) */
        @property --angle {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0c10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
            animation: hueShift 8s linear infinite;
        }

        /* Background gambar dari link, digelapkan 80% (warna RGB tidak bocor ke sini) */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                var(--bg-image, none) center / cover no-repeat,
                #0b0c10;
        }

        @keyframes hueShift {
            from { --hue: 0; }
            to   { --hue: 360; }
        }

        .micro-card {
            max-width: 600px;
            width: 100%;
            background: rgba(18, 20, 28, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 2rem 1.75rem;
            position: relative;
        }

        /* Garis tepi RGB tebal, warnanya berjalan berurutan searah jarum jam */
        .micro-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 4px; /* ketebalan garis */
            background: conic-gradient(
                from var(--angle),
                #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            animation: spinBorder 4s linear infinite;
            pointer-events: none;
        }

        @keyframes spinBorder {
            to { --angle: 360deg; }
        }

        .profile {
            text-align: center;
            margin-bottom: 2rem;
        }

        .avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 18px hsl(var(--hue) 100% 55% / 0.5);
            border: 2px solid hsl(var(--hue) 100% 70% / 0.8);
            background: #2c2e3a;
            aspect-ratio: 1 / 1;
            line-height: 0;
        }

        .avatar-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #3b3f5c;
            color: white;
            font-size: 3rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .profile h2 {
            font-size: 1.7rem;
            font-weight: 700;
            color: #f1f3f9;
            letter-spacing: -0.3px;
            margin-bottom: 0.3rem;
        }

        .profile .bio {
            color: #b0b6dd;
            font-size: 0.9rem;
            max-width: 280px;
            margin: 0 auto;
            line-height: 1.4;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 0.5rem 0 2rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 1rem 1.5rem;
            text-decoration: none;
            color: #eef2ff;
            font-weight: 500;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            gap: 12px;
        }

        .link-btn:hover {
            background: hsl(var(--hue) 70% 45% / 0.35);
            border-color: hsl(var(--hue) 100% 65% / 0.8);
            box-shadow: 0 0 16px hsl(var(--hue) 100% 55% / 0.45);
            transform: translateY(-2px);
            color: white;
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
        }

        .link-left i {
            font-size: 1.3rem;
            width: 28px;
            text-align: center;
            color: hsl(var(--hue) 100% 78%);
        }

        .link-text {
            font-size: 1rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-links-message {
            color: #8e94b0;
            text-align: center;
            padding: 1rem;
            font-style: italic;
        }

        /* Hormati pengguna yang mematikan animasi */
        @media (prefers-reduced-motion: reduce) {
            body, .micro-card::before { animation: none; }
        }
    </style>
</head>
<body>
<div class="micro-card">
    <div class="profile">
        <div class="avatar" id="avatarContainer"></div>
        <h2 id="profileName">...</h2>
        <div class="bio" id="profileBio"></div>
    </div>
    <div class="links-list" id="linksList"></div>
</div>

<script>
    // ============================================================
    // 🔧 KONFIGURASI – Ubah sesuai keinginan
    // ============================================================
    const profile = {
        name: "Ulil Aidi",
        bio: "MAN 2 Grobogan",
        avatarUrl: "https://i.ibb.co.com/bMyTGvND/25539232-MUHAMAD-ULIL-AIDI-Foto.png",
        // Isi dengan link gambar untuk background (otomatis digelapkan 80%). Kosongkan untuk polos gelap.
        backgroundUrl: "https://i.ibb.co.com/Vct8rMYV/IMG-20230219-080006-149.webp"
    };

    const links = [
        { text: "geschool lawas", url: "https://drive.google.com/file/d/1L-nKyZuHPy1GYGbrXiKEtx874cDWPac3/view?usp=drive_link", hidden: true },
        { text: "SAFE 3.1", url: "https://drive.google.com/file/d/166o1s572-k_7nV7bPN7PzHDvzJfi2VJb/view?usp=sharing", hidden: true },
        { text: "TKA", url: "https://drive.google.com/drive/folders/1ZYdTAcToA4FR7Y6yz7vQd2BuQkA2_5ji?usp=sharing", hidden: false },
        { text: "MASTER", url: "https://nas.adwi.my.id/s/54z8zwrbJ4XzsN2", hidden: false },
        { text: "PROKTOR", url: "https://drive.google.com/file/d/1-z06AnQjwHLfCfIl3iNbinlsOXPbrz5v/view?usp=sharing", hidden: true },
        { text: "32bit", url: "https://drive.google.com/file/d/1QXNFHywcNtbtM20pGf4t2F6WQgyKHevV/view?usp=drive_link", hidden: true },
        { text: "64bit", url: "https://drive.google.com/file/d/1N5h27CBXSf2y9-udYr9KVumHEbDMEKXs/view?usp=drive_link", hidden: true },
        { text: "Matematika Kelas 10", url: "https://drive.google.com/file/d/1ZDVi9zlNC2OEVNZl6Xiy6UmrcL_5BEA5/view?usp=drive_link", hidden: true },
        { text: "Matematika Lanjut Kelas 11", url: "https://drive.google.com/file/d/1iFd1ZDf3OtR7aVd4shrYVKE89GKCBkch/view?usp=drive_link", hidden: true },
        { text: "INFORMATIKA Kelas 12", url: "https://drive.google.com/file/d/10xT4vLsaUwB2T0igC9YU-Ug0BZ79EXk3/view?usp=drive_link", hidden: true },
        { text: "OMI", url: "https://nas.adwi.my.id/s/e4ySwwb56iBtERf", hidden: true },
        { text: "Uji Web MAN", url: "https://mandaga.my.id/", hidden: false },
        { text: "TKA Matematika Lanjut", url: "https://drive.google.com/drive/folders/1KrE_7Qglv3WDiptw6sKlLvzGgFmMLoqh?usp=drive_link", hidden: true },
        { text: "Instagram", url: "https://instagram.com/", hidden: true },
        { text: "TikTok (contoh tersembunyi)", url: "https://tiktok.com/@", hidden: true },
        { text: "YouTube Channel", url: "https://youtube.com/", hidden: true }
    ];
    // ============================================================

    function renderBackground() {
        if (profile.backgroundUrl && profile.backgroundUrl.trim()) {
            const safe = profile.backgroundUrl.trim().replace(/"/g, "%22");
            document.body.style.setProperty("--bg-image", `url("${safe}")`);
        }
    }

    function renderProfile() {
        document.getElementById("profileName").innerText = profile.name || "Pengguna";
        document.getElementById("profileBio").innerText = profile.bio || "";
        const avatarContainer = document.getElementById("avatarContainer");
        const initial = (profile.name ? profile.name.charAt(0).toUpperCase() : "U");
        if (profile.avatarUrl && profile.avatarUrl.trim()) {
            avatarContainer.innerHTML = `<img src="${profile.avatarUrl}" alt="avatar" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'avatar-fallback\\'>${initial}</div>';">`;
        } else {
            avatarContainer.innerHTML = `<div class="avatar-fallback">${initial}</div>`;
        }
    }

    function renderLinks() {
        const container = document.getElementById("linksList");
        const visibleLinks = links.filter(link => !link.hidden);
        if (visibleLinks.length === 0) {
            container.innerHTML = `<div class="empty-links-message">✨ Tidak ada tautan yang ditampilkan saat ini.</div>`;
            return;
        }
        container.innerHTML = "";
        visibleLinks.forEach(link => {
            const a = document.createElement("a");
            a.className = "link-btn";
            a.href = link.url && link.url !== "#" ? link.url : "#";
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            const leftDiv = document.createElement("div");
            leftDiv.className = "link-left";
            let iconClass = "fas fa-link";
            const lower = link.text.toLowerCase();
            if (lower.includes("instagram")) iconClass = "fab fa-instagram";
            else if (lower.includes("tiktok")) iconClass = "fab fa-tiktok";
            else if (lower.includes("youtube")) iconClass = "fab fa-youtube";
            else if (lower.includes("github")) iconClass = "fab fa-github";
            else if (lower.includes("twitter")) iconClass = "fab fa-twitter";
            leftDiv.innerHTML = `<i class="${iconClass}"></i><span class="link-text">${escapeHtml(link.text)}</span>`;
            a.appendChild(leftDiv);
            a.appendChild(document.createElement("i")).className = "fas fa-arrow-right";
            container.appendChild(a);
        });
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    renderBackground();
    renderProfile();
    renderLinks();
</script>
</body>
</html>
